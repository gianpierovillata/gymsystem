{% extends "base.html" %}

{% block title %}Usuarios{% endblock %}
{% block heading %}Usuarios{% endblock %}

{% block content %}
    <table>
        <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Role</th>
        </tr>
        {% for usuario in usuarios %}
        <tr>
            <td>{{ usuario.nombre }}</td>
            <td>{{ usuario.email }}</td>
            <td>{{ usuario.role }}</td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
