<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gym System{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #ddd;
        }

        .header {
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            padding: 25px 40px;
            border-bottom: 3px solid #ff6b00;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff6b00, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header a {
            color: #ff6b00;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .header a:hover {
            color: #ff8c00;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
        }

        .page-title {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        th {
            background: #1a1a1a;
            color: #ff6b00;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            padding: 14px 16px;
            text-align: left;
            border-bottom: 2px solid #ff6b00;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #222;
            color: #ccc;
            font-size: 0.9rem;
        }

        tr:hover td {
            background: #1a1a1a;
        }

        caption {
            color: #ff6b00;
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 10px;
            text-align: left;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #444;
            font-size: 0.85rem;
            border-top: 1px solid #1a1a1a;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>{% block heading %}Gym System{% endblock %}</h1>
        <a href="/">&larr; Volver al inicio</a>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        &copy; 2026 Gym System &mdash; Todos los derechos reservados
    </div>
</body>
</html>
